name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # ==========================================
  # Code Quality Checks
  # ==========================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Tối ưu thời gian install
      
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install flake8 black isort
      
      - name: Run flake8 (Linting)
        run: |
          # Check Python code quality (bỏ qua các lỗi đặc thù của Databricks Spark/DLT)
          flake8 src/ tests/ --count --select=E9,F63,F7 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --ignore=E501,E402,F401,F811,F841,W291,E712 --builtins=spark,dbutils --max-line-length=127 --statistics
      
      - name: Run black (Code Formatting)
        run: |
          # Check if code is formatted correctly
          black --check --diff src/ tests/
      
      - name: Run isort (Import Sorting)
        run: |
          # Bổ sung cờ --profile black trực tiếp vào lệnh
          isort --profile black --check-only --diff src/ tests/
      
      # Notification on failure
      - name: Notify on code quality failure
        if: failure()
        run: |
          echo "Code quality checks failed"
          echo "Please run locally:"
          echo "  - black src/ tests/"
          echo "  - isort src/ tests/"
          echo "  - flake8 src/ tests/"

  # ==========================================
  # Stage 1: Unit Tests (Pre-deployment)
  #  WITH PARALLEL TESTING
  # ==========================================
  unit-tests:
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pyspark pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run pytest with coverage
        run: |
          cd tests
          # Thêm cờ -m "not integration" để bỏ qua các integration tests ở khâu Pre-deployment
          pytest -v --tb=short -m "not integration" --cov=../src --cov-report=term-missing
      
      # Notification on failure
      - name: Notify on test failure
        if: failure()
        run: |
          echo "Unit tests failed on Python ${{ matrix.python-version }}!"
          echo "Run locally: pytest -v tests/"

  # ==========================================
  # Stage 2: Validate Bundle
  # ==========================================
  validate-bundle:
    name: Validate Bundle Configuration
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Validate bundle
        run: databricks bundle validate -t dev
      
      # Notification on failure
      - name: Notify on validation failure
        if: failure()
        run: |
          echo "Bundle validation failed"
          echo "Run locally: databricks bundle validate -t dev"

  # ==========================================
  # Stage 3: Deploy to Dev
  # ==========================================
  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: validate-bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Deploy bundle
        run: databricks bundle deploy -t dev
      
      - name: Run Integration Tests
        run: |
          # Trigger the integration test job (hoặc full-pipeline)
          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name | (contains("run-integration-tests") or contains("full-pipeline"))) | .job_id' | head -1)
          
          if [ -n "$JOB_ID" ]; then
            echo "Triggering integration test job: $JOB_ID"
            RUN_ID=$(databricks jobs run-now --job-id $JOB_ID --output json | jq -r '.run_id')
            
            echo "Waiting for test job to complete..."
            databricks runs wait $RUN_ID
            
            # Check result
            RESULT=$(databricks runs get --run-id $RUN_ID --output json | jq -r '.state.result_state')
            
            if [ "$RESULT" != "SUCCESS" ]; then
              echo "Integration tests failed!"
              exit 1
            fi
            
            echo "Integration tests passed!"
          else
            echo "Integration test job not found, skipping..."
          fi
      
      # Notification on failure
      - name: Notify on deploy failure
        if: failure()
        run: |
          echo "Dev deployment or integration tests failed!"
          echo "Check Databricks workspace for details."

  # ==========================================
  # Stage 4: Deploy to Team (Production)
  # ==========================================
  deploy-team:
    name: Deploy to Team Environment
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Deploy to team
        run: databricks bundle deploy -t team
      
      # Success notification
      - name: Notify on success
        if: success()
        run: |
          echo "Successfully deployed to production environment"
      
      # Notification on failure
      - name: Notify on production deploy failure
        if: failure()
        run: |
          echo "Production deployment failed"
          echo "CRITICAL: Manual intervention required."