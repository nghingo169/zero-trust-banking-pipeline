# This is a Declarative Automation Bundle definition for zero-trust-banking-pipeline.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: zero-trust-banking-pipeline

experimental:
  # Development mode normally prefixes UC schema names with the deployer.
  # This bundle uses explicit, stable schema names across workspaces.
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog destination catalog.
    default: workspace
  source_landing_schema:
    description: Shared immutable raw-file landing schema for every source domain.
    default: source_landing
  source_landing_volume:
    description: Managed volume that receives raw source snapshots before Bronze ingestion.
    default: source_snapshot_files
  bronze_schema:
    description: Unified Bronze schema for all source-domain tables.
    default: bronze
  source_mode:
    description: "Source location mode: volume for local-development uploads or s3 for production."
    default: volume
  source_root:
    description: Root directory containing business_date snapshot folders.
    default: ""
  silver_validated_schema:
    description: Production-style schema for normalized and validated Silver source tables.
    default: silver_validated
  governance_schema:
    description: Production-style schema for pipeline operations, monitoring views, and quarantine tables.
    default: governance
  silver_schema:
    description: Production-style schema for Silver atomic model tables.
    default: silver
  gold_schema:
    description: Production-style schema for Gold investigation contexts.
    default: gold
  pipeline_service_principal_name:
    description: Application ID of the service principal that runs the parent job and SDP pipeline.
  governance_service_principal_name:
    description: Application ID of the service principal that owns governance setup operations.
  data_engineer_group:
    description: Account group receiving masked Silver/Gold and redacted DQ evidence access.
    default: data-engineers
  governance_admin_group:
    description: Account group permitted to manage governance objects and inspect unmasked data.
    default: governance-admins
  pii_dq_operator_group:
    description: JIT-only account group exempted from PII masks for time-bound DQ investigations.
    default: pii-dq-operator

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      file_path: /Workspace/banking-dev/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files
    variables:
      catalog: banking_investigation
      source_mode: s3
      source_root: "s3://nab-src-dataset/banking/snapshots/simulation_id=banking-20260705-20260710/snapshot_type=full"
      data_engineer_group: data-engineers
      governance_admin_group: governance-admins
      pii_dq_operator_group: pii-dq-operator
    resources:
      pipelines:
        banking_investigation_pipeline:
          configuration:
            spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
            spark.hadoop.fs.s3a.access.key: "{{secrets/banking-s3-ingestion/access-key-id}}"
            spark.hadoop.fs.s3a.secret.key: "{{secrets/banking-s3-ingestion/secret-access-key}}"
            spark.hadoop.fs.s3a.endpoint.region: ap-southeast-1

  team:
    mode: development
    variables:
      source_mode: s3
      source_root: "s3://nab-src-dataset/banking/snapshots/simulation_id=banking-20260705-20260710/snapshot_type=full"
    resources:
      pipelines:
        banking_investigation_pipeline:
          configuration:
            spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
            spark.hadoop.fs.s3a.access.key: "{{secrets/banking-s3-ingestion/access-key-id}}"
            spark.hadoop.fs.s3a.secret.key: "{{secrets/banking-s3-ingestion/secret-access-key}}"
            spark.hadoop.fs.s3a.endpoint.region: ap-southeast-1

  staging:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      file_path: /Workspace/banking-staging/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files
    variables:
      catalog: banking_investigation
      source_mode: s3
      source_root: "s3://nab-src-dataset/banking/snapshots/simulation_id=banking-20260705-20260710/snapshot_type=full"
      data_engineer_group: data-engineers
      governance_admin_group: governance-admins
      pii_dq_operator_group: pii-dq-operator
    resources:
      pipelines:
        banking_investigation_pipeline:
          configuration:
            spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
            spark.hadoop.fs.s3a.access.key: "{{secrets/banking-s3-ingestion/access-key-id}}"
            spark.hadoop.fs.s3a.secret.key: "{{secrets/banking-s3-ingestion/secret-access-key}}"
            spark.hadoop.fs.s3a.endpoint.region: ap-southeast-1
