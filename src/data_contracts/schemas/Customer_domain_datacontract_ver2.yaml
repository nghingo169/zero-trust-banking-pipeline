# ==============================================================================
# Banking Bronze Mock Data Contract - ODCS v3.1.0
# ------------------------------------------------------------------------------

kind: DataContract
name: banking_bronze_mock_data_contract
version: 2.0.0
status: active
domain: banking
tenant: BankingDataPipelineProgram
description:
  purpose: Defines the expected shape, business rules, and known dirty-data edge cases of the Bronze-layer
    banking mock dataset - covering the Customer Master Data, Customer Transaction Data, Fin Crime Data,
    and Card Data domains generated by generate_mock_data.py (dbldatagen + Faker) - so the Silver-layer
    (AWM) transformation pipeline has a single, versioned source of truth to build cleansing, entity-resolution,
    and dirty-data handling logic against.
  limitations: Describes the intentionally dirty Bronze representation, not the cleaned Silver output.
    Dirty-data rates (percentages) are generator targets embedded in generate_mock_data.py, not guarantees
    on real source-system data - re-baseline thresholds before reusing this contract against a live core
    banking / CRM / compliance feed. Five different, mutually-inconsistent customer-reference formats
    exist by design across domains (cust_no, party_id, cif_number, app_user_id, AML-CUST-XXXXXX) and are
    documented per-column rather than resolved here; resolution is a Silver-layer crosswalk concern.
  usage: 'Use as the reference for: (1) validating Bronze ingestion output against the expected schema
    and documented edge cases; (2) designing Silver-layer cleansing and entity-resolution transforms for
    the mixed key formats and structural nulls flagged below; and (3) regression-testing dirty-data handling
    logic in the transaction pipeline. Each quality rule''s customProperties.dirtyRuleType tag maps back
    to the config-driven rule categories supported by generate_mock_data.py (missing, invalid_value, duplicate,
    invalid_range, by_design, structural).'
authoritativeDefinitions:
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/schema/
  type: specification
  description: ODCS v3.1.0 schema reference used to author this contract.
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/data-quality/
  type: specification
  description: ODCS v3.1.0 data quality reference used to author the quality rules below.
servers:
- server: bronze_delta_lake
  type: databricks
  environment: dev
  catalog: banking
  schema: bronze
  description: Bronze-layer Delta tables written by generate_mock_data.py. All 33 tables in `schema` below
    are physically materialized here, one Delta table per schema object, using the physicalName given
    on each object.
  
# =============================================================================
# ------ CUSTOMER MASTER DATA DOMAIN (core_banking_customer, crm_customer, customer_kyc, customer_employment, customer_request, customer_account) ------ 
schema:
- id: core_banking_customer__obj
  name: core_banking_customer
  logicalType: object
  physicalType: table
  businessName: Core Banking Customer
  description: 'Primary customer record as extracted from the legacy core banking system. Natural key
    format: CB-XXXX. One of two independently-onboarded customer master sources (the other being crm_customer)
    that were never designed to share a common key.'
  physicalName: core_banking_customer
  properties:
  - id: core_banking_customer__cust_no
    name: cust_no
    logicalType: string
    physicalType: varchar 
    description: Core banking natural key, e.g. CB-xxxxxxx
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: restricted
    quality:
    - id: core_banking_customer__cust_no__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error (high)
      description: cust_no is the primary key of this table and must never be null.
    - id: core_banking_customer__cust_no__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error (high)
      description: cust_no must be unique across all rows.
  - id: account__cif_number
    name: cif_number
    logicalType: string
    physicalType: STRING
    description: Bank-wide Customer Information File number, e.g. CIF00000123.
    required: true
    classification: internal
    quality:
    - id: account__cif_number__third_customer_ref_format
      type: text
      description: Third distinct customer-reference format in this dataset (after cust_no and party_id)
        - requires a crosswalk to resolve against core_banking_customer.cust_no / crm_customer.party_id
        in Silver.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: by_design
    - id: account__cif_number__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^CIF[0-9]{8}$
      mustBeLessThan: 1
      unit: percent
      dimension: conformity
      severity: error
      businessImpact: operational
      description: cif_number must follow the CIF00000123 format.
  - id: core_banking_customer__full_name
    name: full_name
    logicalType: string
    physicalType: Varchar
    description: Customer full name (Faker, AU locale).
    required: true
    classification: confidential
    quality:
    - id: core_banking_customer__full_name__casing_format
      metric: invalidValues
      arguments:
        pattern: ^(?!.*[a-z])[A-Z0-9 .'-]+$|^[A-Z][a-z'.-]*( [A-Z][a-z'.-]*)*$
      mustBeLessThan: 15
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: Breaks naive equality-based customer matching.
      description: ~10% of rows are legacy batch-export artifacts in ALL CAPS instead of Title Case. Not
        a correctness defect, but Silver-layer entity resolution must normalize casing before fuzzy-matching
        against crm_customer.customer_name.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: core_banking_customer__date_of_birth
    name: date_of_birth
    logicalType: date
    physicalType: DATE
    description: Date of birth, 1950-2006 range.
    required: false
    classification: internal
    quality:
    - id: core_banking_customer__date_of_birth__missing
      metric: nullValues
      mustBeLessThan: 5
      unit: percent
      dimension: completeness
      severity: warning
      businessImpact: Impacts age-based eligibility checks.
      description: ~3% of legacy records were never backfilled with date_of_birth.
      customProperties:
      - property: dirtyRuleType
        value: missing
  - id: core_banking_customer__national_id
    name: national_id
    logicalType: string
    physicalType: STRING
    description: National ID number.
    required: false
    classification: restricted
    quality:
    - id: core_banking_customer__national_id__missing
      metric: nullValues
      mustBeLessThan: 7
      unit: percent
      dimension: completeness
      severity: warning
      businessImpact: operational
      description: ~5% of rows are missing national_id.
      customProperties:
      - property: dirtyRuleType
        value: missing
    - id: core_banking_customer__national_id__duplicate
      metric: duplicateValues
      mustBeLessThan: 2
      unit: percent
      dimension: uniqueness
      severity: error
      businessImpact: Risk of identity conflation / KYC failure across two distinct customers.
      description: ~1% of national_id values are duplicated across two different customers due to a data-entry
        error at source.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
  - id: core_banking_customer__phone
    name: phone
    logicalType: string
    physicalType: STRING
    description: Contact phone, digits-only format.
    required: true
    classification: confidential
    quality:
    - id: core_banking_customer__phone__invalid_placeholder
      metric: missingValues
      arguments:
        missingValues:
        - '0000000000'
        - N/A
        - n/a
        - ''
        - '0'
      mustBeLessThan: 5
      unit: percent
      dimension: completeness
      severity: warning
      businessImpact: Unreachable customer for servicing/fraud callback.
      description: ~3% of rows contain invalid placeholder values (e.g. 0000000000, N/A) instead of a
        real digits-only phone number.
      customProperties:
      - property: dirtyRuleType
        value: missing
  - id: core_banking_customer__address
    name: address
    logicalType: string
    physicalType: STRING
    description: Registered address (Faker, AU locale).
    required: true
    classification: confidential
  - id: core_banking_customer__source_system
    name: source_system
    logicalType: string
    physicalType: STRING
    description: Always 'core_banking'.
    required: true
    classification: internal
    quality:
    - id: core_banking_customer__source_system__valid_value
      metric: invalidValues
      arguments:
        validValues:
        - core_banking
      mustBeLessThan: 0
      unit: percent
      dimension: conformity
      severity: error
      businessImpact: operational
      description: Constant value; must always equal 'core_banking'.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: core_banking_customer__created_date
    name: created_date
    logicalType: date
    physicalType: DATE
    description: Record creation date in source system.
    required: true
    classification: internal
  tags:
  - customer-master-data
- id: crm_customer__obj
  name: crm_customer
  logicalType: object
  physicalType: table
  businessName: CRM Customer
  description: 'Customer record from the CRM platform, onboarded independently of core banking. Natural
    key format: CRM-XXX. Overlaps ~70% with core_banking_customer by real person; the remainder are CRM-only
    (digital-only signups).'
  physicalName: crm_customer
  properties:
  - id: crm_customer__party_id
    name: party_id
    logicalType: string
    physicalType: STRING
    description: CRM natural key, e.g. CRM-501.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    businessName: CRM Party ID
    classification: restricted
    quality:
    - id: crm_customer__party_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: party_id is the primary key of this table and must never be null.
    - id: crm_customer__party_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: party_id must be unique across all rows.
  - id: crm_customer__customer_name
    name: customer_name
    logicalType: string
    physicalType: STRING
    description: Customer full name (Faker).
    required: true
    classification: confidential
    quality:
    - id: crm_customer__customer_name__cross_system_format
      type: text
      description: Spacing and diacritics style deliberately differs from core_banking_customer.full_name
        for the same real person. This is a structural cross-source format mismatch, not row-level noise
        - it exists specifically for Silver-layer fuzzy-matching / entity-resolution practice.
      dimension: consistency
      severity: info
      businessImpact: Naive equality join against core_banking_customer.full_name will under-match.
      customProperties:
      - property: dirtyRuleType
        value: by_design
  - id: crm_customer__phone
    name: phone
    logicalType: string
    physicalType: STRING
    description: Contact phone, dashed format (e.g. 090-123-4567).
    required: true
    classification: confidential
    quality:
    - id: crm_customer__phone__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^0[0-9]{2}-[0-9]{3}-[0-9]{4}$
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: CRM phone numbers are expected in dashed format 0XX-XXX-XXXX.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
    - id: crm_customer__phone__cross_system_format
      type: text
      description: Formatting differs from core_banking_customer.phone (dashed vs. digits-only) even for
        the same real person - by design, not an error.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: by_design
  - id: crm_customer__national_id
    name: national_id
    logicalType: string
    physicalType: STRING
    description: National ID, when captured.
    required: false
    classification: restricted
    quality:
    - id: crm_customer__national_id__missing
      metric: nullValues
      mustBeLessThan: 10
      unit: percent
      dimension: completeness
      severity: info
      businessImpact: operational
      description: ~8% missing - CRM does not always require ID capture at signup.
      customProperties:
      - property: dirtyRuleType
        value: missing
  - id: crm_customer__email
    name: email
    logicalType: string
    physicalType: STRING
    description: Customer email.
    required: false
    classification: confidential
    logicalTypeOptions:
      format: email
    quality:
    - id: crm_customer__email__missing
      metric: nullValues
      mustBeLessThan: 6
      unit: percent
      dimension: completeness
      severity: warning
      businessImpact: operational
      description: ~5% of rows are missing email.
      customProperties:
      - property: dirtyRuleType
        value: missing
    - id: crm_customer__email__malformed
      metric: invalidValues
      arguments:
        pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      mustBeLessThan: 4
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: Undeliverable digital communications / statements.
      description: ~3% malformed (missing @, trailing spaces, etc.).
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: crm_customer__source_system
    name: source_system
    logicalType: string
    physicalType: STRING
    description: Always 'crm'.
    required: true
    classification: internal
    quality:
    - id: crm_customer__source_system__valid_value
      metric: invalidValues
      arguments:
        validValues:
        - crm
      mustBeLessThan: 0
      unit: percent
      dimension: conformity
      severity: error
      businessImpact: operational
      description: Constant value; must always equal 'crm'.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: crm_customer__created_date
    name: created_date
    logicalType: date
    physicalType: DATE
    description: Record creation date in CRM.
    required: true
    classification: internal
  tags:
  - customer-master-data
- id: customer_kyc__obj
  name: customer_kyc
  logicalType: object
  physicalType: table
  businessName: Customer KYC
  description: 'KYC/identity verification records, captured by whichever channel onboarded the customer
    - so its customer reference column mixes both cust_no and party_id formats in the same column. customer_ref
    is not the primary key: this target table changes row-by-row depending on which key format it happens
    to hold.'
  physicalName: customer_kyc
  properties:
  - id: customer_kyc__kyc_id
    name: kyc_id
    logicalType: string
    physicalType: STRING
    description: KYC record identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: customer_kyc__kyc_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: kyc_id is the primary key of this table and must never be null.
    - id: customer_kyc__kyc_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: kyc_id must be unique across all rows.
  - id: customer_kyc__customer_ref
    name: customer_ref
    logicalType: string
    physicalType: STRING
    description: Either a cust_no (CB-XXXX) or a party_id (CRM-XXX) depending on onboarding channel.
    required: true
    classification: internal
    quality:
    - id: customer_kyc__customer_ref__mixed_key_format
      type: text
      description: Holds either the core_banking_customer.cust_no format or the crm_customer.party_id
        format, decided per row by onboarding channel. This is the core Silver-layer entity-resolution
        problem for this table - resolve via crosswalk, do not treat the mix itself as a defect.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: by_design
    - id: customer_kyc__customer_ref__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^(CB-[0-9]{4,}|CRM-[0-9]{3,})$
      mustBe: 0
      unit: rows
      dimension: conformity
      severity: error
      businessImpact: operational
      description: Every value must match either the CB-XXXX or CRM-XXX pattern; a value matching neither
        is a genuine data defect (not the expected mix).
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_kyc__id_type
    name: id_type
    logicalType: string
    physicalType: STRING
    description: NATIONAL_ID / PASSPORT.
    required: true
    classification: internal
  - id: customer_kyc__id_number
    name: id_number
    logicalType: string
    physicalType: STRING
    description: Identity document number.
    required: true
    classification: restricted
    quality:
    - id: customer_kyc__id_number__invalid_format
      metric: invalidValues
      arguments:
        pattern: ^[0-9]+$
      mustBeLessThan: 3
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: ~2% contain letters in what should be numeric-only ID fields.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_kyc__verification_status
    name: verification_status
    logicalType: string
    physicalType: STRING
    description: VERIFIED / PENDING / REJECTED.
    required: true
    classification: internal
  - id: customer_kyc__verified_date
    name: verified_date
    logicalType: date
    physicalType: DATE
    description: Date verification completed.
    required: false
    classification: internal
    quality:
    - id: customer_kyc__verified_date__structural_null
      type: sql
      query: SELECT COUNT(*) FROM {object} WHERE verified_date IS NULL AND verification_status <> 'PENDING'
      mustBe: 0
      unit: rows
      dimension: consistency
      severity: error
      businessImpact: operational
      description: verified_date is expected to be null only while verification_status = 'PENDING' (structural,
        not random noise). Any other null is a genuine defect.
      customProperties:
      - property: dirtyRuleType
        value: structural
  tags:
  - customer-master-data
- id: customer_employment__obj
  name: customer_employment
  logicalType: object
  physicalType: table
  businessName: Customer Employment
  description: Self-declared employment/income data used for product eligibility checks.
  physicalName: customer_employment
  properties:
  - id: customer_employment__employment_id
    name: employment_id
    logicalType: string
    physicalType: STRING
    description: Employment record identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: customer_employment__employment_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: employment_id is the primary key of this table and must never be null.
    - id: customer_employment__employment_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: employment_id must be unique across all rows.
  - id: customer_employment__customer_ref
    name: customer_ref
    logicalType: string
    physicalType: STRING
    description: cust_no or party_id, mixed format as in customer_kyc.
    required: true
    classification: internal
    quality:
    - id: customer_employment__customer_ref__mixed_key_format
      type: text
      description: Same mixed cust_no/party_id pattern as customer_kyc.customer_ref.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: by_design
    - id: customer_employment__customer_ref__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^(CB-[0-9]{4,}|CRM-[0-9]{3,})$
      mustBe: 0
      unit: rows
      dimension: conformity
      severity: error
      businessImpact: operational
      description: Every value must match either the CB-XXXX or CRM-XXX pattern.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_employment__employer_name
    name: employer_name
    logicalType: string
    physicalType: STRING
    description: Employer company name (Faker).
    required: true
    classification: internal
  - id: customer_employment__job_title
    name: job_title
    logicalType: string
    physicalType: STRING
    description: Job title (Faker).
    required: true
    classification: internal
  - id: customer_employment__monthly_income
    name: monthly_income
    logicalType: number
    physicalType: DECIMAL(12,2)
    description: Self-declared monthly income (AUS).
    required: true
    classification: confidential
    logicalTypeOptions:
      minimum: 0
    quality:
    - id: customer_employment__monthly_income__invalid_range
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN monthly_income < 0 THEN 1 ELSE 0 END) / COUNT(*), 2) FROM
        {object}
      mustBeLessThan: 1
      unit: percent
      dimension: accuracy
      severity: error
      businessImpact: Corrupts product-eligibility / affordability scoring.
      description: ~1% of rows have a negative monthly_income due to a form-validation gap at source;
        income can never legitimately be negative.
      customProperties:
      - property: dirtyRuleType
        value: invalid_range
  tags:
  - customer-master-data
- id: customer_request__obj
  name: customer_request
  logicalType: object
  physicalType: table
  businessName: Customer Request
  description: Customer service requests, complaints, and inquiries logged across all channels - the primary
    source for service-quality and complaint-resolution reporting.
  physicalName: customer_request
  properties:
  - id: customer_request__request_id
    name: request_id
    logicalType: string
    physicalType: STRING
    description: Request identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: customer_request__request_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: request_id is the primary key of this table and must never be null.
    - id: customer_request__request_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: request_id must be unique across all rows.
  - id: customer_request__customer_ref
    name: customer_ref
    logicalType: string
    physicalType: STRING
    description: cust_no or party_id, mixed format.
    required: true
    classification: internal
    quality:
    - id: customer_request__customer_ref__mixed_key_format
      type: text
      description: Same mixed cust_no/party_id pattern as customer_kyc.customer_ref.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: by_design
    - id: customer_request__customer_ref__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^(CB-[0-9]{4,}|CRM-[0-9]{3,})$
      mustBe: 0
      unit: rows
      dimension: conformity
      severity: error
      businessImpact: operational
      description: Every value must match either the CB-XXXX or CRM-XXX pattern.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_request__request_type
    name: request_type
    logicalType: string
    physicalType: STRING
    description: COMPLAINT / INQUIRY / PRODUCT_REQUEST / CLOSURE_REQUEST.
    required: true
    classification: internal
  - id: customer_request__channel
    name: channel
    logicalType: string
    physicalType: STRING
    description: BRANCH / CALL_CENTER / APP / EMAIL.
    required: true
    classification: internal
  - id: customer_request__request_date
    name: request_date
    logicalType: date
    physicalType: DATE
    description: Date request was logged.
    required: true
    classification: internal
  - id: customer_request__status
    name: status
    logicalType: string
    physicalType: STRING
    description: OPEN / IN_PROGRESS / RESOLVED / REJECTED.
    required: true
    classification: internal
  - id: customer_request__resolution_date
    name: resolution_date
    logicalType: date
    physicalType: DATE
    description: Date request was closed.
    required: false
    classification: internal
    quality:
    - id: customer_request__resolution_date__structural_null
      type: sql
      query: SELECT COUNT(*) FROM {object} WHERE resolution_date IS NULL AND status NOT IN ('OPEN', 'IN_PROGRESS')
      mustBe: 0
      unit: rows
      dimension: consistency
      severity: error
      businessImpact: operational
      description: resolution_date is expected to be null only while status is OPEN or IN_PROGRESS (structural
        null, ~40% of rows). Any other null is a defect.
      customProperties:
      - property: dirtyRuleType
        value: structural
    - id: customer_request__resolution_date__drift_monitor
      metric: nullValues
      mustBeBetween:
      - 25
      - 55
      unit: percent
      dimension: completeness
      severity: info
      businessImpact: Complaint-resolution SLA reporting depends on this ratio being stable.
      description: Baseline open-request ratio should stay near 40%; drift outside this band may indicate
        a resolution-feed failure upstream.
      customProperties:
      - property: dirtyRuleType
        value: structural
  - id: customer_request__description
    name: description
    logicalType: string
    physicalType: STRING
    description: Free-text request description (Faker).
    required: false
    classification: internal
    quality:
    - id: customer_request__description__missing
      metric: nullValues
      mustBeLessThan: 6
      unit: percent
      dimension: completeness
      severity: info
      businessImpact: operational
      description: ~4% missing - agent skipped the free-text notes field.
      customProperties:
      - property: dirtyRuleType
        value: missing
  tags:
  - customer-master-data
- id: customer_account__obj
  name: customer_account
  logicalType: object
  physicalType: table
  businessName: Customer Account Bridge
  description: 'Bridge/relationship table linking a customer to the accounts they hold (a customer may
    hold multiple accounts; an account may have multiple holders, e.g. a joint savings account or a minor''s
    account co-held by a parent). This is the table that physically joins the Customer Master Data domain
    to the Customer Transaction Data domain, via account.cif_number. Generation order: account must be
    created before customer_account.'
  physicalName: customer_account
  properties:
  - id: customer_account__link_id
    name: link_id
    logicalType: string
    physicalType: STRING
    description: Relationship record identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: customer_account__link_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: link_id is the primary key of this table and must never be null.
    - id: customer_account__link_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: link_id must be unique across all rows.
  - id: customer_account__cif_number
    name: cif_number
    logicalType: string
    physicalType: STRING
    description: References account.cif_number (Transaction domain) - the direct join key between the
      two domains.
    required: true
    classification: internal
    relationships:
    - to: account.cif_number
      type: foreignKey
    quality:
    - id: customer_account__cif_number__format_conformity
      metric: invalidValues
      arguments:
        pattern: ^CIF[0-9]{8}$
      mustBeLessThan: 1
      unit: percent
      dimension: conformity
      severity: error
      businessImpact: Breaks the join between Customer Master Data and Customer Transaction Data.
      description: cif_number must follow the CIF00000123 format shared with account.cif_number.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_account__account_id
    name: account_id
    logicalType: integer
    physicalType: BIGINT
    description: References account.account_id (Transaction domain).
    required: true
    classification: internal
    relationships:
    - to: account.account_id
      type: foreignKey
  - id: customer_account__relationship_type
    name: relationship_type
    logicalType: string
    physicalType: STRING
    description: PRIMARY_HOLDER / JOINT_HOLDER / AUTHORIZED_USER.
    required: true
    classification: internal
    quality:
    - id: customer_account__relationship_type__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - PRIMARY_HOLDER
        - JOINT_HOLDER
        - AUTHORIZED_USER
      mustBeLessThan: 2
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: ~1% blank or 'UNKNOWN' due to a migration gap.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
  - id: customer_account__linked_date
    name: linked_date
    logicalType: date
    physicalType: DATE
    description: Date the relationship was established.
    required: true
    classification: internal
  tags:
  - customer-master-data

slaProperties:
- id: sla_generation_frequency
  property: frequency
  value: 1
  unit: d
  element: transaction.txn_timestamp
  driver: operational
  description: Bronze tables are regenerated/refreshed once per day.
  scheduler: cron
  schedule: 0 2 * * *
- id: sla_latency
  property: latency
  value: 4
  unit: h
  element: transaction.txn_timestamp
  driver: operational
  description: Bronze data must be available no later than 4 hours after the start of the scheduled generation
    run.
- id: sla_time_of_availability
  property: timeOfAvailability
  value: 06:00-00:00
  element: transaction.txn_timestamp
  driver: operational
  description: Prior day's Bronze transaction data must be queryable by 06:00 UTC.
- id: sla_availability
  property: availability
  value: '99.5'
  unit: percent
  driver: operational
  description: Target monthly uptime of the Bronze Delta tables for downstream Silver consumption.
- id: sla_error_rate_transaction_amount
  property: errorRate
  value: 1
  unit: percent
  element: transaction.amount
  driver: operational
  description: Upper bound on the negative-CREDIT-amount dirty-data rate injected into transaction.amount,
    matching the documented invalid_range edge case; a rate above this budget indicates the generator
    config drifted from spec.
- id: sla_time_to_detect
  property: timeToDetect
  value: 1
  unit: h
  driver: operational
  description: Maximum time to detect a data quality rule breach after a Bronze generation run completes
    (automated DQ job cadence).
- id: sla_time_to_notify
  property: timeToNotify
  value: 1
  unit: h
  driver: operational
  description: Maximum time to notify the data platform team after a DQ breach is detected.
- id: sla_time_to_repair
  property: timeToRepair
  value: 1
  unit: d
  driver: operational
  description: Target time to repair or re-run the pipeline after a DQ breach is confirmed (next business
    day).
- id: sla_retention_fincrime
  property: retention
  value: 7
  unit: y
  element: aml_case.opened_date,suspicious_activity_report.filed_date
  driver: regulatory
  description: Fin Crime Data (AML cases, SARs, sanctions screening) is retained to align with common
    AML/CFT multi-year recordkeeping obligations. Confirm the exact duration with Compliance/Legal for
    your jurisdiction before relying on this figure.
- id: sla_retention_transaction
  property: retention
  value: 5
  unit: y
  element: transaction.txn_timestamp
  driver: regulatory
  description: Core transaction history retention target. Confirm the exact duration with Compliance/Legal
    for your jurisdiction.
team:
  name: banking-data-platform
  description: Owns the Bronze mock-data generator and this data contract.
  members:
  - username: data-platform-lead
    role: Data Product Owner
    dateIn: '2026-01-01'
  - username: data-engineer
    role: Data Engineer
    description: Maintains generate_mock_data.py and the Bronze pipeline.
    dateIn: '2026-01-01'
roles:
- role: bronze_reader
  access: read
  description: Read access to raw Bronze tables for pipeline development and testing.
  firstLevelApprovers: Data Product Owner
- role: silver_pipeline_writer
  access: read
  description: Read access used by the Silver/AWM transformation pipeline service principal.
  firstLevelApprovers: Data Product Owner
- role: fincrime_analyst_reader
  access: read
  description: Read access to the Fin Crime Data domain (fraud_alert, aml_case, sanction_screening, suspicious_activity_report,
    watchlist, call_center_log, chargeback). Restricted due to compliance sensitivity.
  firstLevelApprovers: Compliance Manager
  secondLevelApprovers: Data Product Owner
