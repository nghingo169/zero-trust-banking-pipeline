        value: Ru_7
      - property: remediationAction
        value: Replace with default/reference value when business rules allow (e.g., blank status -> 'FILED'), log warning.
      - property: thresholdSource
        value: default_pending_calibration
  - id: chargeback__resolved_date
    name: resolved_date
    logicalType: date
    physicalType: DATE
    description: Date the chargeback was resolved.
    required: false
    classification: internal
    quality:
    - id: chargeback__resolved_date__structural_null
      type: sql
      query: SELECT chargeback_id, resolved_date, status FROM chargeback WHERE status IN ('APPROVED', 'DENIED') AND resolved_date IS NULL
      mustBe: 0
      unit: rows
      dimension: consistency
      severity: error
      businessImpact: operational
      description: Missing while status = FILED or UNDER_REVIEW (structural null). Allow null while unresolved; log status. Must be populated when status is APPROVED or DENIED.
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_1
      - property: remediationAction
        value: Replace the missing value with NULL; log a warning.
