# ==============================================================================
# Banking Bronze FinCrime Domain Data Contract - ODCS v3.1.0
# ------------------------------------------------------------------------------

kind: DataContract
name: banking_bronze_fincrime_domain_data_contract
version: 1.0.0
status: active
domain: banking.fincrime
tenant: BankingDataPipelineProgram
description:
  purpose: Defines the expected shape, business rules, and known dirty-data edge cases of the Bronze-layer
    banking mock dataset - covering the FinCrime Data domain (fraud, transaction monitoring, sanctions, AML,
    case-management, analyst notes, SARs, disputes, and risk scores) generated by generate_mock_data.py
    (dbldatagen + Faker) - so the Silver-layer (AWM) transformation pipeline has a single, versioned
    source of truth to build cleansing, entity-resolution, and dirty-data handling logic against.
  limitations: Describes the intentionally dirty Bronze representation, not the cleaned Silver output.
    Dirty-data rates (percentages) are generator targets embedded in generate_mock_data.py, not guarantees
    on real source-system data - re-baseline thresholds before reusing this contract against a live core
    banking / CRM / compliance feed. Five different, mutually-inconsistent customer-reference formats
    exist by design across domains (cust_no, party_id, cif_number, app_user_id, AML-CUST-XXXXXX) and are
    documented per-column rather than resolved here; resolution is a Silver-layer crosswalk concern.
  usage: 'Use as the reference for: (1) validating Bronze ingestion output against the expected schema
    and documented edge cases; (2) designing Silver-layer cleansing and entity-resolution transforms for
    the mixed key formats and structural nulls flagged below; and (3) regression-testing dirty-data handling
    logic in the transaction pipeline. Each quality rule''s customProperties.dirtyRuleType tag maps back
    to the config-driven rule categories supported by generate_mock_data.py (missing, invalid_value, duplicate,
    invalid_range, by_design, structural).'
authoritativeDefinitions:
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/schema/
  type: specification
  description: ODCS v3.1.0 schema reference used to author this contract.
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/data-quality/
  type: specification
  description: ODCS v3.1.0 data quality reference used to author the quality rules below.
servers:
- server: bronze_delta_lake
  type: databricks
  environment: dev
  catalog: banking_mock
  schema: bronze
  description: Bronze-layer Delta tables for the FinCrime Data domain. All 9 tables in `schema`
    below are physically materialized here, one Delta table per schema object, using the physicalName
    given on each object.

# =============================================================================
# ------ FINCRIME DATA DOMAIN ------
schema:
- id: fraud_alert__obj
  name: fraud_alert
  logicalType: object
  physicalType: table
  businessName: Fraud Alert
  description: Fraud-rule/model alert on an account transaction.
  physicalName: fraud_alert
  properties:
  - id: fraud_alert__alert_id
    name: alert_id
    logicalType: string
    physicalType: VARCHAR
    description: Alert identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: fraud_alert__alert_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: alert_id is the primary key of this table and must never be null.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
    - id: fraud_alert__alert_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: alert_id must be unique across all rows.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
  - id: fraud_alert__account_txn_id
    name: account_txn_id
    logicalType: integer
    physicalType: BIGINT
    description: References account_transaction.account_txn_id (Transaction Data domain, out of scope for this contract).
    required: true
    classification: internal
    relationships:
    - to: account_transaction.account_txn_id
      type: foreignKey
    quality:
    - id: fraud_alert__account_txn_id__unresolved
      type: text
      description: Must resolve to an existing account_transaction.account_txn_id via reference mapping. Invalid or unresolved account transaction ID (orphan key) should be quarantined.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed identifier; quarantine the record if no mapping exists.
  - id: fraud_alert__alert_type
    name: alert_type
    logicalType: string
    physicalType: VARCHAR
    description: VELOCITY / GEO_MISMATCH / AMOUNT_OUTLIER / DEVICE_CHANGE.
    required: true
    classification: internal
    quality:
    - id: fraud_alert__alert_type__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - VELOCITY
        - GEO_MISMATCH
        - AMOUNT_OUTLIER
        - DEVICE_CHANGE
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Unrecognized alert category code should be replaced with default value 'UNKNOWN' and log warning.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_7
      - property: remediationAction
        value: Replace with default/reference value when business rules allow (e.g., blank alert_type -> 'UNKNOWN'), log warning.
      - property: thresholdSource
        value: default_pending_calibration
  - id: fraud_alert__alert_score
    name: alert_score
    logicalType: number
    physicalType: DECIMAL(5,2)
    precision: 5
    scale: 2
    description: Risk score, expected 0–100.
    required: true
    classification: internal
    quality:
    - id: fraud_alert__alert_score__invalid_range
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN alert_score IS NOT NULL AND (alert_score < 0.00 OR alert_score > 100.00) THEN 1 ELSE 0 END) / COUNT(*), 2) FROM {object}
      mustBeLessThan: 5
      unit: percent
      dimension: accuracy
      severity: warning
      businessImpact: operational
      description: ~1% scores >100 from scoring-engine bug simulation; clamp value to 100.00 and log warning.
      customProperties:
      - property: dirtyRuleType
        value: invalid_range
      - property: assignedRule
        value: Ru_13
      - property: remediationAction
        value: Clamp or round the numeric value within tolerance; log a warning.
      - property: thresholdSource
        value: default_pending_calibration
  - id: fraud_alert__alert_status
    name: alert_status
    logicalType: string
    physicalType: VARCHAR
    description: OPEN / CLOSED / ESCALATED.
    required: true
    classification: internal
    quality:
    - id: fraud_alert__alert_status__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - OPEN
        - CLOSED
        - ESCALATED
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Invalid or unparseable status value should be standardized or defaulted to 'OPEN'.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_7
      - property: remediationAction
        value: Replace with default/reference value when business rules allow (e.g., blank alert_status -> 'OPEN'), log warning.
      - property: thresholdSource
        value: default_pending_calibration
  - id: fraud_alert__created_date
    name: created_date
    logicalType: date
    physicalType: DATE
    description: Alert creation date.
    required: true
    classification: internal
    quality:
    - id: fraud_alert__created_date__format
      type: text
      description: Invalid or inconsistent date format (e.g. DD/MM/YYYY vs YYYY-MM-DD) should be auto-standardized rather than rejected.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_4
      - property: remediationAction
        value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise standard; log a warning; continue processing.
  tags:
  - fincrime-data
