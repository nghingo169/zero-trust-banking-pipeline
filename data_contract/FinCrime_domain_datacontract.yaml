customProperties:
- property: sourceDesignDocument
  value: FinCrime_Data_Dictionary (2).docx
- property: dirtyRuleTypeTaxonomy
  value:
  - missing
  - invalid_value
  - duplicate
  - invalid_range
  - structural
  description: Kept consistent with the sibling full-domain contract (banking_bronze_mock_data_contract) built from Mock_Data_Design_Document-Final.docx; 'by_design' was not needed here since every rule in this source maps to one of the other five categories.
- property: ruleCatalog

  value:
  - property: rule_Ru_1
    value: Replace the missing value with NULL; log a warning.
    description: 'Ru_1: dimension=completeness, default severity=warning, dirtyRuleType=missing.'
  - property: rule_Ru_2
    value: Look up the reference (or validate by business rule); quarantine the record if unresolved when required.
    description: 'Ru_2: dimension=consistency, default severity=error, dirtyRuleType=structural.'
  - property: rule_Ru_3
    value: Reject the record and write to Error/Quarantine table; fail the batch if mandatory business keys exceed threshold.
    description: 'Ru_3: dimension=completeness, default severity=error, dirtyRuleType=missing.'
  - property: rule_Ru_4
    value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise standard; log a warning; continue processing.
    description: 'Ru_4: dimension=conformity, default severity=warning, dirtyRuleType=invalid_value.'
  - property: rule_Ru_5
    value: Apply transformation rules; if parsing fails, quarantine the record.
    description: 'Ru_5: dimension=conformity, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_6
    value: Reject the record because the value cannot be interpreted reliably.
    description: 'Ru_6: dimension=accuracy, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_7
    value: Replace with default/reference value when business rules allow; log warning.
    description: 'Ru_7: dimension=conformity, default severity=warning, dirtyRuleType=invalid_value.'
  - property: rule_Ru_8
    value: Validate against the relevant reference table / permitted value list; quarantine the record if validation fails.
    description: 'Ru_8: dimension=conformity, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_9
    value: Reject the record for an invalid/impossible business value.
    description: 'Ru_9: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_11
    value: Deduplicate and preserve the latest valid event using sequence number and CDC ordering logic; log the action taken.
    description: 'Ru_11: dimension=consistency, default severity=warning, dirtyRuleType=duplicate.'
  - property: rule_Ru_12
    value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
    description: 'Ru_12: dimension=uniqueness, default severity=error, dirtyRuleType=duplicate.'
  - property: rule_Ru_13
    value: Clamp or round the numeric value within tolerance; log a warning.
    description: 'Ru_13: dimension=accuracy, default severity=warning, dirtyRuleType=invalid_range.'
  - property: rule_Ru_14
    value: Validate against business thresholds; quarantine the record if abnormal.
    description: 'Ru_14: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_15
    value: Reject the record for an impossible amount (negative or exceeding the allowed limit).
    description: 'Ru_15: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_16
    value: Detect the key type using predefined patterns or source metadata, normalize to a canonical key where possible, and log the transformation.
    description: 'Ru_16: dimension=consistency, default severity=warning, dirtyRuleType=structural.'
  - property: rule_Ru_17
    value: Resolve the reference through the cross-reference / mapping table to derive the conformed identifier; quarantine the record if no mapping exists.
    description: 'Ru_17: dimension=consistency, default severity=error, dirtyRuleType=structural.'
  - property: rule_Ru_18
    value: Reject the record if the key cannot be uniquely resolved or is ambiguous.
    description: 'Ru_18: dimension=uniqueness, default severity=error, dirtyRuleType=duplicate.'
  description: Canonicalized Ru_1..Ru_18 catalog from FinCrime_Data_Dictionary.docx's Assigned Rule / Action columns. Every quality rule in `schema` tags customProperties.assignedRule with one of these codes.