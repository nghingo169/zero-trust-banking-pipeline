      type: foreignKey
    quality:
    - id: payment_gateway_status_event__account_txn_id__structural_null
      type: sql
      query: SELECT COUNT(*) FROM payment_gateway_status_event e JOIN payment_gateway_log g ON e.gateway_txn_id
        = g.gateway_txn_id WHERE e.account_txn_id IS NULL AND g.payment_method = 'ACCOUNT_TRANSFER'
      mustBe: 0
      unit: rows
      dimension: consistency
      severity: error
      businessImpact: operational
      description: account_txn_id should be populated whenever the parent payment_gateway_log.payment_method
        = 'ACCOUNT_TRANSFER' (resolved via the shared gateway_txn_id); null in that case means the reference
        failed to resolve.
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed
          identifier; quarantine the record if no mapping exists.
