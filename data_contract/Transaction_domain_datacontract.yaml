      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Unsupported gateway_status must be quarantined. Default monitoring threshold pending
        calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
      - property: thresholdSource
        value: default_pending_calibration
  - id: payment_gateway_log__gateway_timestamp
    name: gateway_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Gateway callback timestamp.
    required: true
    classification: internal
    quality:
    - id: payment_gateway_log__gateway_timestamp__corrupted
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN gateway_timestamp IS NOT NULL AND (gateway_timestamp <
        TIMESTAMP'2020-01-01' OR gateway_timestamp > CURRENT_TIMESTAMP()) THEN 1 ELSE 0 END) / COUNT(*),
        2) FROM {object}
      mustBeLessThan: 5
      unit: percent
      dimension: accuracy
      severity: error
      businessImpact: operational
      description: Reject records with an invalid or corrupted timestamp. Default monitoring threshold
        pending calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_6
      - property: remediationAction
        value: Reject the record because the timestamp cannot be interpreted reliably.
      - property: thresholdSource
        value: default_pending_calibration
  - id: payment_gateway_log__provider_code
    name: provider_code
    logicalType: string
    physicalType: STRING
    description: Payment gateway provider code (e.g. VNPAY / MOMO / ZALOPAY-style identifier).
    required: true
    classification: internal
    quality:
    - id: payment_gateway_log__provider_code__doc_inconsistency
      type: text
      description: Source doc lists this row's Assigned Rule as Ru_8 but its Action text is 'Reject invalid
        timestamp' - clearly copy-pasted from the gateway_timestamp row above. Modeled here using Ru_8's
        standard reference-table validation action instead, since provider_code is categorical, not a
        timestamp.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
  tags:
  - customer-transaction-data
- id: balance_snapshot__obj
  name: balance_snapshot
  logicalType: object
  physicalType: table
  businessName: Balance Snapshot
  description: Periodic account balance facts for trend/liquidity and fraud features; not a ledger reconciliation
    requirement.
  physicalName: balance_snapshot
  properties:
  - id: balance_snapshot__balance_id
    name: balance_id
    logicalType: string
    physicalType: STRING
    description: Balance record identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: confidential
    quality:
    - id: balance_snapshot__balance_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: balance_id is the primary key of this table and must never be null.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
    - id: balance_snapshot__balance_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: balance_id must be unique across all rows.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
  - id: balance_snapshot__account_id
    name: account_id
    logicalType: integer
    physicalType: BIGINT
    description: References account.account_id.
    required: true
    classification: internal
    relationships:
    - to: account.account_id
      type: foreignKey
    quality:
    - id: balance_snapshot__account_id__unresolved
      type: text
      description: Must resolve to an existing account.account_id via reference mapping.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed
          identifier; quarantine the record if no mapping exists.
  - id: balance_snapshot__balance_date
    name: balance_date
    logicalType: date
    physicalType: DATE
    description: Snapshot date.
    required: true
    classification: confidential
    quality:
    - id: balance_snapshot__balance_date__format
      type: text
      description: Invalid/inconsistent date format is auto-standardized to the enterprise format rather
        than rejected.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_4
      - property: remediationAction
        value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise
          standard; log a warning; continue processing.
  - id: balance_snapshot__opening_balance
    name: opening_balance
    logicalType: number
    physicalType: DECIMAL(14,2)
    description: Balance at start of day (AUD).
    required: true
    classification: confidential
    quality:
    - id: balance_snapshot__opening_balance__invalid_numeric_format
      type: text
      description: Invalid numeric format (e.g. unparsable/malformed decimal) is clamped/rounded within
        tolerance and logged, rather than rejecting the record outright.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_range
      - property: assignedRule
        value: Ru_13
      - property: remediationAction
        value: Clamp or round the numeric value within tolerance; log a warning.
  - id: balance_snapshot__closing_balance
    name: closing_balance
    logicalType: number
    physicalType: DECIMAL(14,2)
    description: Balance at end of day (AUD).
    required: true
    classification: confidential
    quality:
    - id: balance_snapshot__closing_balance__invalid_range
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN b.closing_balance < 0 THEN 1 ELSE 0 END) / COUNT(*), 2)
        FROM balance_snapshot b JOIN account a ON b.account_id = a.account_id WHERE a.product_type = 'SAVINGS'
      mustBeLessThan: 0.5
      unit: percent
      dimension: accuracy
      severity: error
      businessImpact: operational
      description: ~0.5% negative closing_balance on SAVINGS-type accounts, which should never go negative.
        Requires a join to account.product_type to evaluate.
      customProperties:
      - property: dirtyRuleType
        value: invalid_range
      - property: assignedRule
        value: Ru_9
      - property: remediationAction
        value: Reject the record for an invalid/impossible business value.
      - property: thresholdSource
        value: source_doc
  - id: balance_snapshot__available_balance
    name: available_balance
    logicalType: number
    physicalType: DECIMAL(14,2)
    description: Balance available for withdrawal (AUD).
    required: true
    classification: confidential
    quality:
    - id: balance_snapshot__available_balance__exceeds_closing
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN available_balance > closing_balance THEN 1 ELSE 0 END)
        / COUNT(*), 2) FROM {object}
      mustBeLessThan: 5
      unit: percent
      dimension: accuracy
      severity: error
      businessImpact: operational
      description: available_balance must not exceed closing_balance; validate against this business threshold
        and quarantine abnormal rows. Default monitoring threshold pending calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_range
      - property: assignedRule
        value: Ru_14
      - property: remediationAction
        value: Validate against business thresholds; quarantine the record if abnormal.
      - property: thresholdSource
        value: default_pending_calibration
  tags:
  - customer-transaction-data

#------------------------------------------------------------------------------------------
slaProperties:
- id: sla_generation_frequency
  property: frequency
  value: 1
  unit: d
  element: account_transaction.txn_timestamp
  driver: operational
  description: Bronze transaction-domain tables are refreshed once per day.
  scheduler: cron
  schedule: 0 2 * * *
- id: sla_latency
  property: latency
  value: 4
  unit: h
  element: account_transaction.txn_timestamp
  driver: operational
  description: Bronze data must be available no later than 4 hours after the start of the scheduled generation
    run.
- id: sla_time_of_availability
  property: timeOfAvailability
  value: 06:00-00:00
  element: account_transaction.txn_timestamp
  driver: operational
  description: Prior day's Bronze transaction data must be queryable by 06:00 UTC.
- id: sla_availability
  property: availability
  value: '99.5'
  unit: percent
  driver: operational
  description: Target monthly uptime of the Bronze Delta tables for downstream Silver consumption.
- id: sla_error_rate_amount
  property: errorRate
  value: 5
  unit: percent
  element: account_transaction.amount
  driver: operational
  description: Upper bound on impossible-value (Ru_15) rows in account_transaction.amount before the run
    is considered out of contract. Default threshold pending calibration against real observed rates.
- id: sla_cdc_ordering_completeness
  property: completeness
  value: 99
  unit: percent
  element: account_transaction_status_event.sequence_number
  driver: operational
  description: Minimum share of account_transaction rows that must have at least one resolvable status-event
    row in account_transaction_status_event, reflecting the CDC feed's role as the full state-change history.
- id: sla_time_to_detect
  property: timeToDetect
  value: 1
  unit: h
  driver: operational
  description: Maximum time to detect a data quality rule breach after a Bronze generation run completes
    (automated DQ job cadence).
- id: sla_time_to_notify
  property: timeToNotify
  value: 1
  unit: h
  driver: operational
  description: Maximum time to notify the data platform team after a DQ breach is detected.
- id: sla_time_to_repair
  property: timeToRepair
  value: 1
  unit: d
  driver: operational
  description: Target time to repair or re-run the pipeline after a DQ breach is confirmed (next business
    day).
- id: sla_retention_transaction
  property: retention
  value: 5
  unit: y
  element: account_transaction.txn_timestamp
  driver: regulatory
  description: Core transaction history retention target. Confirm the exact duration with Compliance/Legal
    for your jurisdiction before relying on this figure.
team:
  name: banking-data-platform
  description: Owns the Bronze transaction-domain pipeline and this data contract.
  members:
  - username: data-platform-lead
    role: Data Product Owner
    dateIn: '2026-01-01'
  - username: data-engineer
    role: Data Engineer
    description: Implements the Ru_1..Ru_18 remediation logic in the Silver pipeline.
    dateIn: '2026-01-01'
roles:
- role: bronze_reader
  access: read
  description: Read access to raw Bronze transaction-domain tables for pipeline development and testing.
  firstLevelApprovers: Data Product Owner
- role: silver_pipeline_writer
  access: read
  description: Read access used by the Silver transformation pipeline service principal.
  firstLevelApprovers: Data Product Owner
customProperties:
- property: sourceDesignDocument
  value: Transaction_tables.docx
- property: dirtyRuleTypeTaxonomy
  value:
  - missing
  - invalid_value
  - duplicate
  - invalid_range
  - structural
  description: Kept consistent with the sibling full-domain contract (banking_bronze_mock_data_contract)
    built from Mock_Data_Design_Document-Final.docx; 'by_design' was not needed here since every rule
    in this source maps to one of the other five categories.
- property: ruleCatalog
  value:
  - property: rule_Ru_1
    value: Replace the missing value with NULL; log a warning.
    description: 'Ru_1: dimension=completeness, default severity=warning, dirtyRuleType=missing.'
  - property: rule_Ru_2
    value: Look up the reference (or validate by business rule); quarantine the record if unresolved when
      required.
    description: 'Ru_2: dimension=consistency, default severity=error, dirtyRuleType=structural.'
  - property: rule_Ru_4
    value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise
      standard; log a warning; continue processing.
    description: 'Ru_4: dimension=conformity, default severity=warning, dirtyRuleType=invalid_value.'
  - property: rule_Ru_5
    value: Apply source-specific formatting/parsing rules to the raw value; quarantine the record if parsing
      fails.
    description: 'Ru_5: dimension=conformity, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_6
    value: Reject the record because the timestamp cannot be interpreted reliably.
    description: 'Ru_6: dimension=accuracy, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_8
    value: Validate against the relevant reference table / permitted value list; quarantine the record
      if validation fails.
    description: 'Ru_8: dimension=conformity, default severity=error, dirtyRuleType=invalid_value.'
  - property: rule_Ru_9
    value: Reject the record for an invalid/impossible business value.
    description: 'Ru_9: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_11
    value: Deduplicate and preserve the latest valid event using sequence number and CDC ordering logic;
      log the action taken.
    description: 'Ru_11: dimension=consistency, default severity=warning, dirtyRuleType=duplicate.'
  - property: rule_Ru_12
    value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
    description: 'Ru_12: dimension=uniqueness, default severity=error, dirtyRuleType=duplicate.'
  - property: rule_Ru_13
    value: Clamp or round the numeric value within tolerance; log a warning.
    description: 'Ru_13: dimension=accuracy, default severity=warning, dirtyRuleType=invalid_range.'
  - property: rule_Ru_14
    value: Validate against business thresholds; quarantine the record if abnormal.
    description: 'Ru_14: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_15
    value: Reject the record for an impossible amount (negative or exceeding the allowed limit).
    description: 'Ru_15: dimension=accuracy, default severity=error, dirtyRuleType=invalid_range.'
  - property: rule_Ru_17
    value: Resolve the reference through the cross-reference / mapping table to derive the conformed identifier;
      quarantine the record if no mapping exists.
    description: 'Ru_17: dimension=consistency, default severity=error, dirtyRuleType=structural.'
  - property: rule_Ru_18
    value: Reject the record if the key cannot be uniquely resolved or is ambiguous.
    description: 'Ru_18: dimension=uniqueness, default severity=error, dirtyRuleType=duplicate.'
  description: Canonicalized Ru_1..Ru_18 catalog from Transaction_tables.docx's Assigned Rule / Action
    columns. Every quality rule in `schema` tags customProperties.assignedRule with one of these codes.