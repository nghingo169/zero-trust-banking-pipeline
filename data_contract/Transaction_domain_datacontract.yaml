# ==============================================================================
# Banking Bronze Transaction Domain Data Contract - ODCS v3.1.0
# ------------------------------------------------------------------------------

kind: DataContract
name: banking_bronze_transaction_domain_data_contract
version: 1.0.0
status: active
domain: banking.transactions
tenant: BankingDataPipelineProgram
description:
  purpose: Defines the expected shape, business rules, and known dirty-data edge cases of the Bronze-layer
    banking mock dataset - covering the Customer Master Data, Customer Transaction Data, Fin Crime Data,
    and Card Data domains generated by generate_mock_data.py (dbldatagen + Faker) - so the Silver-layer
    (AWM) transformation pipeline has a single, versioned source of truth to build cleansing, entity-resolution,
    and dirty-data handling logic against.
  limitations: Describes the intentionally dirty Bronze representation, not the cleaned Silver output.
    Dirty-data rates (percentages) are generator targets embedded in generate_mock_data.py, not guarantees
    on real source-system data - re-baseline thresholds before reusing this contract against a live core
    banking / CRM / compliance feed. Five different, mutually-inconsistent customer-reference formats
    exist by design across domains (cust_no, party_id, cif_number, app_user_id, AML-CUST-XXXXXX) and are
    documented per-column rather than resolved here; resolution is a Silver-layer crosswalk concern.
  usage: 'Use as the reference for: (1) validating Bronze ingestion output against the expected schema
    and documented edge cases; (2) designing Silver-layer cleansing and entity-resolution transforms for
    the mixed key formats and structural nulls flagged below; and (3) regression-testing dirty-data handling
    logic in the transaction pipeline. Each quality rule''s customProperties.dirtyRuleType tag maps back
    to the config-driven rule categories supported by generate_mock_data.py (missing, invalid_value, duplicate,
    invalid_range, by_design, structural).'
authoritativeDefinitions:
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/schema/
  type: specification
  description: ODCS v3.1.0 schema reference used to author this contract.
- url: https://bitol-io.github.io/open-data-contract-standard/v3.1.0/data-quality/
  type: specification
  description: ODCS v3.1.0 data quality reference used to author the quality rules below.
servers:
- server: bronze_delta_lake
  type: databricks
  environment: dev
  catalog: banking_mock
  schema: bronze
  description: Bronze-layer Delta tables for the Customer Transaction Data domain. All 12 tables in `schema`
    below are physically materialized here, one Delta table per schema object, using the physicalName
    given on each object.


# =============================================================================
# ------ TRANSACTION DATA DOMAIN  ------ 
schema:
- id: account__obj
  name: account
  logicalType: object
  physicalType: table
  businessName: Account
  description: Deposit or loan account source record, retaining both the servicing customer reference
    and CIF where supplied.
  physicalName: account
  properties:
  - id: account__account_id
    name: account_id
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate account identifier.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: account__account_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: account_id is the primary key of this table and must never be null.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_18
      - property: remediationAction
        value: Reject the record if the key cannot be uniquely resolved or is ambiguous.
    - id: account__account_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: account_id must be unique across all rows.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_18
      - property: remediationAction
        value: Reject the record if the key cannot be uniquely resolved or is ambiguous.
  - id: account__customer_ref
    name: customer_ref
    logicalType: string
    physicalType: STRING
    description: References core_banking_customer.cust_no (Customer Master Data domain, out of scope for
      this contract). Source-native/mixed identifier; resolution to a conformed customer is a Silver-layer
      responsibility.
    required: true
    classification: internal
    relationships:
    - to: core_banking_customer.cust_no
      type: foreignKey
    quality:
    - id: account__customer_ref__mixed_identifier
      type: text
      description: customer_ref is documented as source-native and possibly mixed-format (cust_no vs.
        party_id); do not assume a single consistent format. References an object outside this contract's
        scope (see description.limitations). Included for lineage; validate against the owning domain's
        own contract.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed
          identifier; quarantine the record if no mapping exists.
  - id: account__cif_number
    name: cif_number
    logicalType: string
    physicalType: STRING
    description: Source-system primary or servicing-holder CIF. Use customer_account (bridge table, out
      of scope here) for the complete holder relationship including joint holders. References core_banking_customer.cif_number.
    required: true
    classification: internal
    relationships:
    - to: core_banking_customer.cif_number
      type: foreignKey
    quality:
    - id: account__cif_number__scope_note
      type: text
      description: 'CIF is a source-native Core Banking identifier; it does not resolve CRM identity at
        Bronze. NOTE: core_banking_customer.cif_number is not part of the previously published Customer
        Master Data contract - confirm with the data-model owner whether that table needs an added cif_number
        column, or whether this FK should instead point elsewhere.'
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed
          identifier; quarantine the record if no mapping exists.
  - id: account__product_type
    name: product_type
    logicalType: string
    physicalType: STRING
    description: SAVINGS / CHECKING / LOAN.
    required: true
    classification: internal
    quality:
    - id: account__product_type__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - SAVINGS
        - CHECKING
        - LOAN
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Must validate against the reference table of supported product types. Threshold is
        a default monitoring bound pending real calibration - the source doc specifies the check, not
        an observed rate.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
      - property: thresholdSource
        value: default_pending_calibration
  - id: account__status
    name: status
    logicalType: string
    physicalType: STRING
    description: ACTIVE / DORMANT / CLOSED.
    required: true
    classification: internal
    quality:
    - id: account__status__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - ACTIVE
        - DORMANT
        - CLOSED
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Use only the statuses permitted by the corresponding source event/state model. Default
        monitoring threshold pending calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
      - property: thresholdSource
        value: default_pending_calibration
  - id: account__open_date
    name: open_date
    logicalType: date
    physicalType: DATE
    description: Account opening date.
    required: true
    classification: internal
    quality:
    - id: account__open_date__format
      type: text
      description: Source dates may arrive in an inconsistent format; auto-standardize to the enterprise
        date format on ingestion rather than rejecting.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_4
      - property: remediationAction
        value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise
          standard; log a warning; continue processing.
  - id: account__branch_code
    name: branch_code
    logicalType: string
    physicalType: STRING
    description: Opening branch code.
    required: true
    classification: internal
    quality:
    - id: account__branch_code__invalid_value
      type: text
      description: Must validate against the reference table of valid branch codes; no enumerable value
        list is available to this contract, so this is documented as a text rule rather than a checkable
        pattern/enum.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
  tags:
  - customer-transaction-data
- id: account_transaction_status_event__obj
  name: account_transaction_status_event
  logicalType: object
  physicalType: table
  businessName: Account Transaction Status Event
  description: Immutable account-transaction state-change feed for CDC ordering and late-arrival testing.
  physicalName: account_transaction_status_event
  properties:
  - id: account_transaction_status_event__status_event_id
    name: status_event_id
    logicalType: string
    physicalType: STRING
    description: Unique source event identifier; supports idempotent ingestion and deduplication.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    quality:
    - id: account_transaction_status_event__status_event_id__not_null
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
      businessImpact: operational
      description: status_event_id is the primary key of this table and must never be null.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
    - id: account_transaction_status_event__status_event_id__unique
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
      businessImpact: operational
      description: status_event_id must be unique across all rows.
      customProperties:
      - property: dirtyRuleType
        value: duplicate
      - property: assignedRule
        value: Ru_12
      - property: remediationAction
        value: Reject duplicate primary/event IDs to prevent duplicate events and ensure idempotent ingestion.
  - id: account_transaction_status_event__account_txn_id
    name: account_txn_id
    logicalType: integer
    physicalType: BIGINT
    description: References account_transaction.account_txn_id.
    required: true
    classification: internal
    relationships:
    - to: account_transaction.account_txn_id
      type: foreignKey
    quality:
    - id: account_transaction_status_event__account_txn_id__source_doc_contradiction
      type: text
      description: Source design doc labels this column both 'Unique, Required' and 'deliberately non-unique
        because one transaction has multiple state changes' in the same cell - a self-contradiction. Modeled
        here as required but NOT unique (one account_txn_id legitimately repeats across many status-event
        rows); confirm intent with the doc owner.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: structural
      - property: assignedRule
        value: Ru_17
      - property: remediationAction
        value: Resolve the reference through the cross-reference / mapping table to derive the conformed
          identifier; quarantine the record if no mapping exists.
  - id: account_transaction_status_event__status
    name: status
    logicalType: string
    physicalType: STRING
    description: INITIATED / PENDING / SUCCESS / REJECTED / CANCELED.
    required: true
    classification: internal
    quality:
    - id: account_transaction_status_event__status__invalid_value
      metric: invalidValues
      arguments:
        validValues:
        - INITIATED
        - PENDING
        - SUCCESS
        - REJECTED
        - CANCELED
      mustBeLessThan: 5
      unit: percent
      dimension: conformity
      severity: warning
      businessImpact: operational
      description: Use only the statuses permitted by the corresponding source event/state model. Default
        monitoring threshold pending calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_8
      - property: remediationAction
        value: Validate against the relevant reference table / permitted value list; quarantine the record
          if validation fails.
      - property: thresholdSource
        value: default_pending_calibration
  - id: account_transaction_status_event__status_timestamp
    name: status_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Business time when the source recorded the status change.
    required: true
    classification: internal
    quality:
    - id: account_transaction_status_event__status_timestamp__corrupted
      type: sql
      query: SELECT ROUND(100.0 * SUM(CASE WHEN status_timestamp IS NOT NULL AND (status_timestamp < TIMESTAMP'2020-01-01'
        OR status_timestamp > CURRENT_TIMESTAMP()) THEN 1 ELSE 0 END) / COUNT(*), 2) FROM {object}
      mustBeLessThan: 5
      unit: percent
      dimension: accuracy
      severity: error
      businessImpact: operational
      description: Timestamp cannot be reliably interpreted if it falls outside a sane business range;
        reject such records rather than propagate them. Default monitoring threshold pending calibration.
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_6
      - property: remediationAction
        value: Reject the record because the timestamp cannot be interpreted reliably.
      - property: thresholdSource
        value: default_pending_calibration
  - id: account_transaction_status_event__source_arrival_timestamp
    name: source_arrival_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Source arrival time; may be physically out of business-time order for late-arrival testing.
    required: true
    classification: internal
    quality:
    - id: account_transaction_status_event__source_arrival_timestamp__late_arrival_by_design
      type: text
      description: May legitimately arrive after later business events - retained specifically for out-of-order
        CDC testing; do not treat source_arrival_timestamp < status_timestamp as a defect on its own.
      dimension: consistency
      severity: info
      businessImpact: operational
      customProperties:
      - property: dirtyRuleType
        value: invalid_value
      - property: assignedRule
        value: Ru_4
      - property: remediationAction
        value: Auto-standardize the date/timestamp format (and timezone, where applicable) to the enterprise
          standard; log a warning; continue processing.
  - id: account_transaction_status_event__sequence_number
    name: sequence_number
    logicalType: integer
    physicalType: BIGINT
    description: Source-derived monotonic sequence within account_txn_id; tie-breaker for CDC ordering.
    required: true
    classification: internal
  quality:
  - id: account_transaction_status_event__seq_unique_per_txn
    type: sql
    mustBe: 0
    unit: rows
    query: SELECT COUNT(*) FROM (SELECT account_txn_id, sequence_number, COUNT(*) c FROM {object} GROUP
      BY account_txn_id, sequence_number HAVING COUNT(*) > 1) dup
    description: sequence_number must be unique within a given account_txn_id (it is the CDC ordering
      tie-breaker); a repeated pair means two events claim the same position in the state-change sequence.
    dimension: consistency
    severity: warning
    businessImpact: operational
    customProperties:
    - property: dirtyRuleType
      value: duplicate
    - property: assignedRule
      value: Ru_11
    - property: remediationAction
      value: Deduplicate and preserve the latest valid event using sequence number and CDC ordering logic;
        log the action taken.
  tags:
  - customer-transaction-data
