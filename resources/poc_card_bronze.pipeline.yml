resources:
  pipelines:
    poc_card_bronze:
      name: poc-card-bronze
      catalog: ${var.catalog}
      schema: ${var.poc_bronze_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../notebooks/pipeline/transformations/card_bronze_ingestion.py
      configuration:
        pipeline.target_catalog: ${var.catalog}
        pipeline.target_schema: ${var.poc_bronze_schema}
        pipeline.source_root: /Volumes/${var.catalog}/${var.poc_landing_schema}/${var.poc_landing_volume}/banking_v2/snapshots
        pipeline.simulation_id: ${var.simulation_id}
        pipeline.card_tables: ${var.card_tables}
        pipeline.available_business_dates: ${var.poc_snapshot_dates}
