resources:
  pipelines:
    dev_customer_bronze:
      name: dev-customer-bronze
      catalog: ${var.catalog}
      schema: ${var.dev_customer_bronze_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/bronze/customer_ingestion.py
      configuration:
        pipeline.target_catalog: ${var.catalog}
        pipeline.target_schema: ${var.dev_customer_bronze_schema}
        pipeline.source_root: /Volumes/${var.catalog}/${var.source_landing_schema}/${var.source_landing_volume}/banking_v2/snapshots/domain=customer_master
        pipeline.simulation_id: ${var.simulation_id}
        pipeline.customer_tables: ${var.customer_tables}
        pipeline.available_business_dates: ${var.replay_snapshot_dates}
        pipeline.domain_path: ${workspace.file_path}/src
