resources:
  pipelines:
    dev_transaction_silver_validation:
      name: dev-transaction-silver-validation
      catalog: ${var.catalog}
      schema: ${var.dev_transaction_silver_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/silver/transaction_validation.py
      configuration:
        pipeline.catalog: ${var.catalog}
        pipeline.bronze_schema: ${var.dev_transaction_bronze_schema}
        pipeline.quarantine_schema: ${var.dev_transaction_quarantine_schema}
        pipeline.quality_rules_path: ${workspace.file_path}/src
