resources:
  pipelines:
    dev_card_silver_validation:
      name: dev-card-silver-validation
      catalog: ${var.catalog}
      schema: ${var.dev_card_silver_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/silver/card_validation.py
      configuration:
        pipeline.catalog: ${var.catalog}
        pipeline.bronze_schema: ${var.dev_card_bronze_schema}
        pipeline.quarantine_schema: ${var.dev_card_quarantine_schema}
        pipeline.quality_rules_path: ${workspace.file_path}/src
