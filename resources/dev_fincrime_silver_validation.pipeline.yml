resources:
  pipelines:
    dev_fincrime_silver_validation:
      name: dev-fincrime-silver-validation
      catalog: ${var.catalog}
      schema: ${var.dev_fincrime_silver_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/silver/fincrime_validation.py
      configuration:
        pipeline.catalog: ${var.catalog}
        pipeline.bronze_schema: ${var.dev_fincrime_bronze_schema}
        pipeline.quarantine_schema: ${var.dev_fincrime_quarantine_schema}
        pipeline.quality_rules_path: ${workspace.file_path}/src
