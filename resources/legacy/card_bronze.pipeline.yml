resources:
  pipelines:
    card_bronze_ingestion:
      name: card-bronze-ingestion
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/bronze/card_ingestion.py
      configuration:
        pipeline.target_catalog: ${var.catalog}
        pipeline.target_schema: ${var.bronze_schema}
        pipeline.source_root: ${var.source_root}
        pipeline.simulation_id: ${var.simulation_id}
        pipeline.card_tables: ${var.card_tables}
        pipeline.available_business_dates: ${var.bronze_snapshot_dates}
