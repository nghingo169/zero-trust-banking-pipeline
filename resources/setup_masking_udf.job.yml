resources:
  jobs:
    setup_masking_udf:
      name: banking-governance-setup-masking-udf
      run_as:
        service_principal_name: ${var.governance_service_principal_name}
      permissions:
        - service_principal_name: ${var.pipeline_service_principal_name}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: setup_masking_udf
          notebook_task:
            notebook_path: ../src/pipeline/governance/01_setup_tags_and_udf.py
            base_parameters:
              catalog: ${var.catalog}
