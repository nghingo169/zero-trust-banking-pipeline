resources:
  jobs:
    poc_card_daily:
      name: poc-card-daily
      max_concurrent_runs: 1
      parameters:
        - name: business_date
          default: "2026-07-05"
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.poc_card_bronze.id}
        - task_key: silver_quality
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.poc_card_silver_quality.id}
