resources:
  jobs:
    banking_investigation_pipeline_orchestration:
      name: banking-investigation-pipeline-orchestration
      description: Recurring Source-to-Gold SDP update with governance tagging and run finalization.
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.pipeline_service_principal_name}
      permissions:
        - group_name: ${var.data_engineer_group}
          level: CAN_MANAGE_RUN
      parameters:
        - name: business_date
          default: "2026-07-10"
      tasks:
        - task_key: initialize_pipeline_run
          notebook_task:
            notebook_path: ../src/pipeline/monitoring/pre_transform_setup.py
            base_parameters:
              business_date: "{{job.parameters.business_date}}"
              run_id: "{{job.run_id}}"
              pipeline_name: banking-investigation-pipeline
              catalog: ${var.catalog}
              governance_schema: ${var.governance_schema}
              source_path: ${workspace.file_path}/src

        - task_key: banking_investigation_pipeline
          depends_on:
            - task_key: initialize_pipeline_run
          pipeline_task:
            pipeline_id: ${resources.pipelines.banking_investigation_pipeline.id}

        - task_key: apply_and_verify_pii_tags
          depends_on:
            - task_key: banking_investigation_pipeline
          run_job_task:
            job_id: ${resources.jobs.apply_and_verify_pii_tags.id}

        - task_key: finalize_success
          depends_on: &completion_tasks
            - task_key: banking_investigation_pipeline
            - task_key: apply_and_verify_pii_tags
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../src/pipeline/monitoring/finalize_pipeline_run.py
            base_parameters:
              run_id: "{{job.run_id}}"
              pipeline_name: banking-investigation-pipeline
              pipeline_id: ${resources.pipelines.banking_investigation_pipeline.id}
              status: SUCCEEDED
              catalog: ${var.catalog}
              governance_schema: ${var.governance_schema}
              event_log_table: banking_investigation_pipeline_event_log
              fail_after_recording: "false"

        - task_key: finalize_failure
          depends_on: *completion_tasks
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../src/pipeline/monitoring/finalize_pipeline_run.py
            base_parameters:
              run_id: "{{job.run_id}}"
              pipeline_name: banking-investigation-pipeline
              pipeline_id: ${resources.pipelines.banking_investigation_pipeline.id}
              status: FAILED
              catalog: ${var.catalog}
              governance_schema: ${var.governance_schema}
              event_log_table: banking_investigation_pipeline_event_log
              fail_after_recording: "true"
