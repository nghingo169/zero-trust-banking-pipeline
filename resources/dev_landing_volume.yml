resources:
  schemas:
    dev_bronze:
      name: ${var.bronze_schema}
      catalog_name: ${var.catalog}
      comment: "Raw append-only Card Bronze tables for the personal-workspace POC."

    dev_silver:
      name: ${var.silver_schema}
      catalog_name: ${var.catalog}
      comment: "Temporary Card SCD Type 2 proof-of-concept output."

    dev_landing:
      name: ${var.landing_schema}
      catalog_name: ${var.catalog}
      comment: "Free Edition landing schema for local Card snapshot arrival simulation."

  volumes:
    card_snapshot_files:
      name: ${var.landing_volume}
      catalog_name: ${var.catalog}
      schema_name: ${var.landing_schema}
      volume_type: MANAGED
      comment: "Uploaded Card Parquet snapshots used as the raw file source for the Bronze POC."
