resources:
  pipelines:
    dev_customer_silver_validation:
      name: dev-customer-silver-validation
      catalog: ${var.catalog}
      schema: ${var.dev_customer_silver_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/silver/customer_validation.py
      configuration:
        pipeline.catalog: ${var.catalog}
        pipeline.bronze_schema: ${var.dev_customer_bronze_schema}
        pipeline.quarantine_schema: ${var.dev_customer_quarantine_schema}
        pipeline.quality_rules_path: ${workspace.file_path}/src
