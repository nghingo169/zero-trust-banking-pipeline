resources:
  jobs:
    banking_investigation_bootstrap:
      name: banking-investigation-bootstrap
      description: One-time and governance-change setup for catalog objects, masking UDF, and ABAC policy.
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.governance_service_principal_name}
      permissions:
        - group_name: ${var.governance_admin_group}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: setup_catalog_and_schemas
          notebook_task:
            notebook_path: ../src/pipeline/governance/00_setup_catalog_and_schemas.py
            base_parameters:
              catalog: ${var.catalog}
              source_landing_schema: ${var.source_landing_schema}
              source_landing_volume: ${var.source_landing_volume}
              source_mode: ${var.source_mode}
              bronze_schema: ${var.bronze_schema}
              silver_validated_schema: ${var.silver_validated_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              governance_schema: ${var.governance_schema}
              pipeline_service_principal_name: ${var.pipeline_service_principal_name}
              governance_admin_group: ${var.governance_admin_group}
              data_engineer_group: ${var.data_engineer_group}
              pii_dq_operator_group: ${var.pii_dq_operator_group}
              source_path: ${workspace.file_path}/src

        - task_key: setup_masking_udf
          depends_on:
            - task_key: setup_catalog_and_schemas
          notebook_task:
            notebook_path: ../src/pipeline/governance/01_setup_tags_and_udf.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: setup_abac_policy
          depends_on:
            - task_key: setup_masking_udf
          notebook_task:
            notebook_path: ../src/pipeline/governance/02_setup_abac_policy.py
            base_parameters:
              catalog: ${var.catalog}
              pipeline_service_principal_name: ${var.pipeline_service_principal_name}
              governance_admin_group: ${var.governance_admin_group}
              pii_dq_operator_group: ${var.pii_dq_operator_group}
