resources:
  pipelines:
    dev_card_bronze:
      name: dev-card-bronze
      catalog: ${var.catalog}
      schema: ${var.dev_card_bronze_schema}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/pipeline/bronze/card_ingestion.py
      configuration:
        pipeline.target_catalog: ${var.catalog}
        pipeline.target_schema: ${var.dev_card_bronze_schema}
        pipeline.source_root: /Volumes/${var.catalog}/${var.source_landing_schema}/${var.source_landing_volume}/banking_v2/snapshots/domain=card
        pipeline.simulation_id: ${var.simulation_id}
        pipeline.card_tables: ${var.card_tables}
        pipeline.available_business_dates: ${var.replay_snapshot_dates}
        pipeline.domain_path: ${workspace.file_path}/src
